app:
  nickname: YourBotName
  prefix:
    - .
  autoAuthorize: true
plugins:
  proxy-agent: {}
  http: {}
  ./src/index:iroseclaw: {}
  koishi-plugin-adapter-iirose:iirose:
    roomId: YOUR_ROOM_ID
    usename: YOUR_IIROSE_USERNAME
    uid: YOUR_BOT_UID
    password: YOUR_IIROSE_PASSWORD
    autoReconnect: true
    reconnectInterval: 5000
    botStatus: 'n'
    color: rgba(49, 31, 186, 1)
    signature: I am a bot
